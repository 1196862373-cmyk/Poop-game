<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>赛博解压 4399 轰炸版</title>
    <style>
        body { text-align: center; font-family: 'Courier New', sans-serif; background: #0d1117; color: #00ffcc; padding: 20px; user-select: none; overflow: hidden; }
        .nav { margin-bottom: 20px; }
        button.menu { font-size: 18px; padding: 10px 24px; margin: 0 10px; cursor: pointer; background: #161b22; color: #00ffcc; border: 2px solid #00ffcc; border-radius: 8px; font-weight: bold; box-shadow: 0 0 10px rgba(0, 255, 204, 0.3); transition: all 0.2s; }
        button.menu:hover { background: #00ffcc; color: #0d1117; box-shadow: 0 0 20px rgba(0, 255, 204, 0.8); }
        .stage { position: relative; width: 360px; height: 420px; margin: 0 auto; background: #161b22; border: 3px solid #00ffcc; border-radius: 16px; overflow: hidden; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 30px rgba(0, 255, 204, 0.2); }
        #muyu { font-size: 110px; background: none; border: none; cursor: pointer; filter: drop-shadow(0 0 15px #00ffcc); }
        #muyu:active { transform: scale(0.8); }
        #target-photo { width: 100%; height: 100%; object-fit: cover; position: absolute; top:0; left:0; z-index:1; }
        .flying-baba { position: absolute; font-size: 50px; pointer-events: none; z-index: 10; transition: all 0.15s cubic-bezier(0.18, 0.89, 0.32, 1.28); }
        .baba { position: absolute; font-size: 65px; transform: translate(-50%, -50%) scale(1); pointer-events: none; opacity: 0.95; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6)) contrast(1.1); user-select: none; z-index: 5; animation: splat 0.1s ease-out; }
        @keyframes splat { 0% { transform: translate(-50%, -50%) scale(1.8); } 100% { transform: translate(-50%, -50%) scale(1); } }
        .float-text { position: absolute; font-size: 28px; font-weight: bold; pointer-events: none; text-shadow: 0 0 10px currentColor; z-index: 12; animation: floatUpAndAway 0.4s ease-out forwards; }
        @keyframes floatUpAndAway { 0% { opacity: 1; transform: translateY(0) scale(0.5); } 100% { opacity: 0; transform: translateY(-70px) scale(1.2); } }
        .particle { position: absolute; width: 10px; height: 10px; border-radius: 50%; pointer-events: none; z-index: 11; animation: particleMove 0.4s ease-out forwards; }
        @keyframes particleMove { 0% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(var(--mx), var(--my)) scale(0); opacity: 0; } }
        .final-boss { font-size: 180px; z-index: 20; animation: ultimateShake 0.1s infinite, neonGlow 1s infinite alternate; }
        @keyframes ultimateShake { 0% { transform: translate(2px, 2px); } 50% { transform: translate(-2px, -2px); } 100% { transform: translate(1px, 2px); } }
        @keyframes neonGlow { 0% { filter: drop-shadow(0 0 10px #ff00ff); } 100% { filter: drop-shadow(0 0 40px #ff0000); } }
        #upload-area { margin-top: 20px; }
        input[type="file"] { color: #00ffcc; }
        #upload-tip { color: #555; padding: 20px; z-index: 2; }
    </style>
</head>
<body>
    <div class="nav">
        <button class="menu" onclick="change('muyu')">⚡ 赛博木鱼</button>
        <button class="menu" onclick="change('baba')">💥 粒子全角度轰炸</button>
    </div>
    <h2 id="txt" style="text-shadow: 0 0 10px #00ffcc;">功德能级: 0 🌟</h2>
    <div class="stage" id="stage" onclick="clickStage(event)">
        <button id="muyu" onclick="playMuyu(event)">🐟</button>
        <img id="target-photo" src="" style="display:none;">
        <span id="upload-tip" style="display:none;">[等待载入目标图像档案...]</span>
    </div>
    <div id="upload-area" style="display: none;">
        <input type="file" id="image-loader" accept="image/*" onchange="handleImage(this)">
    </div>
    <script>
        let mode = 'muyu', gongde = 0, count = 0, isGameOver = false, hasPhoto = false;
        function change(m) {
            mode = m; document.getElementById('muyu').style.display = m === 'muyu' ? 'block' : 'none';
            const img = document.getElementById('target-photo'); const tip = document.getElementById('upload-tip'); const uploadBar = document.getElementById('upload-area');
            if (m === 'baba') {
                uploadBar.style.display = 'block';
                if (isGameOver) {} else if (!hasPhoto) { tip.style.display = 'block'; img.style.display = 'none'; } else { img.style.display = 'block'; tip.style.display = 'none'; }
                document.getElementById('txt').innerText = isGameOver ? 'OVERKILL: 目标彻底崩坏！🎉' : `冲击波次: ${count} / 20 💢`;
                document.getElementById('txt').style.color = '#ff3366'; document.getElementById('txt').style.textShadow = '0 0 10px #ff3366';
            } else {
                uploadBar.style.display = 'none'; img.style.display = 'none'; tip.style.display = 'none';
                document.getElementById('txt').innerText = `功德能级: ${gongde} 🌟`; document.getElementById('txt').style.color = '#00ffcc'; document.getElementById('txt').style.textShadow = '0 0 10px #00ffcc';
            }
        }
        function handleImage(input) { const file = input.files[0]; if (file) { const reader = new FileReader(); reader.onload = function(e) { const img = document.getElementById('target-photo'); img.src = e.target.result; img.style.display = 'block'; document.getElementById('upload-tip').style.display = 'none'; hasPhoto = true; }; reader.readAsDataURL(file); } }
        function soundMuyu() { let ctx = new (window.AudioContext || window.webkitAudioContext)(); let osc = ctx.createOscillator(), gain = ctx.createGain(); osc.frequency.setValueAtTime(300, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.08); gain.gain.setValueAtTime(0.6, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12); osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.12); }
        function soundBaba() { let ctx = new (window.AudioContext || window.webkitAudioContext)(); let osc = ctx.createOscillator(), gain = ctx.createGain(); osc.type = 'triangle'; osc.frequency.setValueAtTime(150, ctx.currentTime); osc.frequency.linearRampToValueAtTime(400, ctx.currentTime + 0.1); osc.frequency.setValueAtTime(90, ctx.currentTime + 0.1); osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.2); gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.4, ctx.currentTime + 0.1); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25); osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.25); }
        function spawnParticles(x, y, color) { const stage = document.getElementById('stage'); for (let i = 0; i < 15; i++) { const p = document.createElement('div'); p.className = 'particle'; p.style.backgroundColor = color; p.style.left = x + 'px'; p.style.top = y + 'px'; const angle = Math.random() * Math.PI * 2; const distance = Math.random() * 80 + 40; p.style.setProperty('--mx', (Math.cos(angle) * distance) + 'px'); p.style.setProperty('--my', (Math.sin(angle) * distance) + 'px'); stage.appendChild(p); setTimeout(() => p.remove(), 400); } }
        function playMuyu(e) { gongde++; soundMuyu(); let rect = document.getElementById('stage').getBoundingClientRect(); document.getElementById('txt').innerText = `功德能级: ${gongde} 🌟`; let fakeEvent = { clientX: e.clientX, clientY: e.clientY }; float(fakeEvent, 'CRITICAL +1 🌟', '#00ffcc'); spawnParticles(e.clientX - rect.left, e.clientY - rect.top, '#00ffcc'); }
        function float(e, text, color) { let rect = document.getElementById('stage').getBoundingClientRect(); let div = document.createElement('div'); div.className = 'float-text'; div.style.left = (e.clientX - rect.left) + 'px'; div.style.top = (e.clientY - rect.top) + 'px'; div.style.color = color; div.innerText = text; document.getElementById('stage').appendChild(div); setTimeout(() => div.remove(), 400); }
        function clickStage(e) { if (isGameOver) return; let stage = document.getElementById('stage'); let rect = stage.getBoundingClientRect(); let targetX = e.clientX - rect.left; let targetY = e.clientY - rect.top; if (mode === 'muyu') { return; } else if (mode === 'baba') { if (!hasPhoto) { alert("⚠️ 探测到目标档案空缺，请先载入照片！"); return; } count++; document.getElementById('txt').innerText = `冲击波次: ${count} / 20 💢`; soundBaba(); const flyer = document.createElement('span'); flyer.className = 'flying-baba'; flyer.innerText = '💩'; const edge = Math.floor(Math.random() * 4); if(edge === 0) { flyer.style.left = '-60px'; flyer.style.top = Math.random()*420+'px'; } else if(edge === 1) { flyer.style.left = '420px'; flyer.style.top = Math.random()*420+'px'; } else if(edge === 2) { flyer.style.left = Math.random()*360+'px'; flyer.style.top = '-60px'; } else { flyer.style.left = Math.random()*360+'px'; flyer.style.top = '480px'; } stage.appendChild(flyer); setTimeout(() => { flyer.style.left = targetX + 'px'; flyer.style.top = targetY + 'px'; }, 10); setTimeout(() => { flyer.remove(); if (isGameOver) return; let b = document.createElement('span'); b.className = 'baba'; b.innerText = '💩'; b.style.left = targetX + 'px'; b.style.top = targetY + 'px'; stage.appendChild(b); float(e, 'SPLAT! 💩', '#ff3366'); spawnParticles(targetX, targetY, '#8B4513'); if (count >= 20) { isGameOver = true; stage.innerHTML = '<span class="final-boss">💩</span>'; document.getElementById('txt').innerText = 'OVERKILL: 目标彻底崩坏！🎉'; } }, 140); } }
    </script>
</body>
</html>
